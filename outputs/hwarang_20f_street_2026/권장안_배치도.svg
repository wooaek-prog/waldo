<text x="18" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">화랑 20층 4개동 – 남서–북동 보행로형 2x2</text>
<text x="18" y="56" font-family="sans-serif" font-size="12.5" fill="#555">보행로 폭 15m · 길이 123m · 가로벽 91m · 건폐율 22.33% · 실면적 51,187㎡</text>
<text x="18" y="76" font-family="sans-serif" font-size="12.5" fill="#555">진한 남색 = 20층 주동(외형선 = 발코니 끝) · 연두 띠 = 남서–북동 보행로 · 붉은 파선 = 대지경계. 상단이 북.</text>
<text x="18" y="96" font-family="sans-serif" font-size="12.5" fill="#555">서쪽 대교아파트(최단 5.9m) → 북동 여의도초(최단 17.6m) 로 이어지는 길. 일조 분석은 생략.</text>
