<text x="18" y="32" font-family="sans-serif" font-size="19" font-weight="bold" fill="#111">여의도여자고등학교 본관동 고층부(5층) – 파사드 전개 입면과 수광점</text>
<text x="18" y="56" font-family="sans-serif" font-size="12.5" fill="#555">파사드 길이 45.3m · 높이 19.95m · 창 1.1~2.9m(중앙 2m) · 파사드 방위 141.8° · 교실 모듈 9m · 교실당 창 2개소 · 수광점 50개</text>
<text x="18" y="76" font-family="sans-serif" font-size="12.5" fill="#555">붉은 점 = 일조 계산 수광점(창 중앙 높이). 회색 빗금 = 교실창 없음으로 제외한 구간</text>
