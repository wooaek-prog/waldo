<text x="18" y="56" font-family="sans-serif" font-size="12.5" fill="#555">파사드 길이 72.5m · 높이 17.00m · 층고 3.2m · 창 0.9~3m(중앙 1.95m) · 파사드 방위 231.9° · 수광점 125개(25개/층)</text>
<text x="18" y="76" font-family="sans-serif" font-size="12.5" fill="#555">붉은 점 = 일조 계산 수광점(창 중앙 높이). 회색 빗금 = 교실창 없음으로 제외한 구간</text>
