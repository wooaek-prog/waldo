<text x="18" y="56" font-family="sans-serif" font-size="12.5" fill="#555">굵은 청색 = 수광점을 두는 남측 외벽 / 회색 = 대상 외 외벽(북측·단부벽). 상단이 북.</text>
<text x="18" y="76" font-family="sans-serif" font-size="12.5" fill="#555">붉은 점은 각 층 수광점이 평면상 겹쳐 보이는 위치입니다.</text>
