<text x="18" y="56" font-family="sans-serif" font-size="12.5" fill="#555">파사드 길이 77.2m · 높이 16.00m · 창 0.9~3.3m(중앙 2.1m) · 파사드 방위 142.0° · 교실 모듈 9m·창 2개소 · 수광점 64개</text>
<text x="18" y="76" font-family="sans-serif" font-size="12.5" fill="#555">붉은 점 = 일조 계산 수광점(창 중앙 높이). 회색 빗금 = 교실창 없음으로 제외한 구간</text>
